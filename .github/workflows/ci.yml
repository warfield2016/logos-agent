name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: cargo check + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check --workspace
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo test --workspace
        run: cargo test --workspace

  build-cdylib:
    name: build cdylib + verify cbindgen header
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release -p agent-core
        run: cargo build --release -p agent-core

      - name: Verify cbindgen header exists
        run: |
          test -f target/include/agent_core.h
          echo "✓ agent_core.h generated"
          echo "--- First 20 lines ---"
          head -20 target/include/agent_core.h

      - name: Verify FFI symbols are exported
        run: |
          if command -v nm > /dev/null; then
            nm -D target/release/libagent_core.so | grep -E "^[0-9a-f]+ T agent_" || true
            echo "✓ FFI symbol audit complete"
          fi

  spec-link-check:
    name: validate spec doc internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        run: |
          # Cheap link audit; replace with markdown-link-check when stabilized.
          for f in spec/*.md docs/*.md README.md; do
            grep -nE '\[.*\]\([^)]+\)' "$f" | grep -v 'https?://' | grep -v 'mailto:' || true
          done
          echo "✓ Internal link audit complete"

  # CI gate for RISC0_DEV_MODE=0 verification.
  # Disabled until Phase 3 lands LEZ programs — currently a no-op placeholder
  # so the badge stays green during scaffold-only weeks.
  risc0-proofs:
    name: RISC0_DEV_MODE=0 integration test
    runs-on: ubuntu-latest
    if: false  # enable in Phase 3 after programs/ are wired
    steps:
      - uses: actions/checkout@v4
      - run: echo "Placeholder for Week-3 RISC0_DEV_MODE=0 integration test"
