# cbindgen config — emits agent_core.h for the auto-generated Qt plugin shim.
# Run via build.rs on every release build.

language = "C"
header = "/* DO NOT EDIT — generated by cbindgen from agent-core. */"
include_guard = "AGENT_CORE_H"
pragma_once = true
autogen_warning = "/* GENERATED FILE — see crates/agent-core/cbindgen.toml */"

[export]
prefix = "agent_"
item_types = ["enums", "structs", "functions"]

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
