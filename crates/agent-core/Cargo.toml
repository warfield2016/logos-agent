[package]
name = "agent-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Logos Autonomous AI Agent runtime — exposed as a C library that the auto-generated Qt plugin shim loads into Logos Core."

[lib]
name = "agent_core"
# `cdylib` produces the .so/.dylib/.dll that Logos Core loads.
# `rlib` is kept so integration tests in this workspace can link against it.
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
agent-skill-sdk = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
ed25519-dalek = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
once_cell = "1.20"
parking_lot = "0.12"

[build-dependencies]
# Generates agent_core.h for the Qt shim (`logos-cpp-generator --from-c-header`).
cbindgen = "0.27"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3.13"
